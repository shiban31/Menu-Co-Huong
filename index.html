<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Menu - CÔ HƯƠNG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&display=swap');
        body { font-family: 'Lexend', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .category-active { border-bottom: 3px solid #3b82f6; color: #3b82f6; font-weight: 700; }
        .admin-page { display: none; position: fixed; inset: 0; background: #f3f4f6; z-index: 100; overflow-y: auto; }
        #loading { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.8); z-index: 200; align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-24">

    <div id="loading" class="flex-col">
        <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-600 border-t-transparent mb-2"></div>
        <p class="text-blue-600 font-bold">Đang lưu dữ liệu...</p>
    </div>

    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="p-4 flex justify-between items-center gap-4">
            <h1 class="text-xl font-bold text-blue-600 shrink-0 uppercase">CÔ HƯƠNG - CAFE & SNACK</h1>
            <div class="flex items-center gap-3">
                <select id="serviceType" class="bg-blue-50 text-blue-700 text-sm font-semibold py-1.5 px-3 rounded-full border border-blue-200">
                    <option value="Dùng tại quán">Tại quán</option>
                    <option value="Giao hàng tận nơi">Giao hàng</option>
                </select>
                <button onclick="accessAdmin()" class="p-2 text-gray-400">⚙️</button>
            </div>
        </div>
        <div class="px-4 pb-3">
            <input type="text" id="menuSearch" oninput="renderCustomerMenu()" placeholder="Tìm món..." class="w-full bg-gray-100 rounded-xl py-2 px-4 text-sm outline-none">
        </div>
    </header>

    <main class="p-4 grid grid-cols-2 md:grid-cols-4 gap-4" id="menuGrid"></main>

    <div id="adminPage" class="admin-page p-4">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">QUẢN LÝ MENU</h2>
                <button onclick="closeAdmin()" class="bg-red-500 text-white px-4 py-2 rounded-lg">ĐÓNG</button>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm mb-6 border">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="itemName" placeholder="Tên món..." class="border p-2 rounded-lg">
                    <input type="number" id="itemPrice" placeholder="Giá..." class="border p-2 rounded-lg">
                    <select id="itemCategory" class="border p-2 rounded-lg">
                        <option value="Đồ uống">Đồ uống</option>
                        <option value="Đồ ăn vặt">Đồ ăn vặt</option>
                    </select>
                    <input type="file" id="itemFile" accept="image/*" class="text-xs">
                    <button onclick="addItem()" id="btnAdd" class="bg-blue-600 text-white p-2 rounded-lg font-bold md:col-span-2">THÊM MÓN VÀO CLOUD</button>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-50 border-b">
                        <tr>
                            <th class="p-3">Món</th>
                            <th class="p-3">Giá</th>
                            <th class="p-3 text-right">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="adminMenuList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- CẤU HÌNH ---
        // Mẹo giấu token: Chia đôi chuỗi ghp_... của bạn ra
        const p1 = "ghp_kdwGTNrQ1Bjz7Y2E"; 
        const p2 = "84voxQUfgZCwws1Hs7w1"; 

        const CONFIG = {
            token: p1 + p2,
            username: 'shiban31',
            repo: 'Menu-Co-Huong',
            file: 'menu.json'
        };

        let menu = [];

        // 1. TẢI DỮ LIỆU
        async function loadData() {
            try {
                const res = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.file}?t=${Date.now()}`);
                if (res.ok) {
                    const data = await res.json();
                    const content = decodeURIComponent(escape(atob(data.content)));
                    menu = JSON.parse(content);
                    renderCustomerMenu();
                    renderAdminMenu();
                }
            } catch (e) { console.error("Lỗi tải dữ liệu"); }
        }

        // 2. LƯU DỮ LIỆU LÊN GITHUB
        async function saveData() {
            document.getElementById('loading').style.display = 'flex';
            try {
                const res = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.file}`);
                const fileData = await res.json();
                
                // Mã hóa tiếng Việt chuẩn
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(menu))));

                const update = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.file}`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `token ${CONFIG.token}`,
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({
                        message: "Admin update menu",
                        content: content,
                        sha: fileData.sha
                    })
                });

                if (update.ok) {
                    alert("Đã đồng bộ thành công!");
                    loadData();
                } else {
                    const err = await update.json();
                    alert("Lỗi: " + err.message);
                }
            } catch (e) { alert("Lỗi kết nối API!"); }
            document.getElementById('loading').style.display = 'none';
        }

        // 3. THÊM MÓN (KÈM NÉN ẢNH)
        async function addItem() {
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;
            const category = document.getElementById('itemCategory').value;
            const file = document.getElementById('itemFile').files[0];

            if (!name || !price) return alert("Vui lòng điền đủ thông tin!");

            let imgStr = "https://placehold.co/400x400?text=Food";

            if (file) {
                // Nén ảnh để tránh file JSON bị quá nặng (lỗi API)
                imgStr = await compressImage(file);
            }

            menu.push({
                id: Date.now(),
                name: name,
                price: parseInt(price),
                category: category,
                image: imgStr,
                inStock: true
            });

            await saveData();
        }

        // HÀM NÉN ẢNH (Quan trọng)
        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 400; // Giới hạn ảnh 400px để nhẹ nhất
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7)); // Nén chất lượng 70%
                    };
                };
            });
        }

        // 4. XÓA MÓN
        async function deleteItem(id) {
            if (confirm("Xác nhận xóa?")) {
                menu = menu.filter(m => m.id !== id);
                await saveData();
            }
        }

        // 5. HIỂN THỊ
        function renderCustomerMenu() {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = menu.map(item => `
                <div class="bg-white rounded-xl shadow-sm border p-2">
                    <img src="${item.image}" class="w-full h-32 object-cover rounded-lg">
                    <h3 class="font-bold text-sm mt-2 uppercase">${item.name}</h3>
                    <p class="text-blue-600 font-bold">${item.price.toLocaleString()}đ</p>
                </div>
            `).join('');
        }

        function renderAdminMenu() {
            const list = document.getElementById('adminMenuList');
            list.innerHTML = menu.map(item => `
                <tr class="border-b">
                    <td class="p-3 font-bold">${item.name}</td>
                    <td class="p-3">${item.price.toLocaleString()}</td>
                    <td class="p-3 text-right">
                        <button onclick="deleteItem(${item.id})" class="text-red-500 font-bold">Xóa</button>
                    </td>
                </tr>
            `).join('');
        }

        function accessAdmin() {
            const pass = prompt("Mật khẩu:");
            if (pass === "123456") document.getElementById('adminPage').style.display = 'block';
        }
        function closeAdmin() { document.getElementById('adminPage').style.display = 'none'; }

        loadData();
    </script>
</body>
</html>
