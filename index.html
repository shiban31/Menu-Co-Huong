<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Menu - CÔ HƯƠNG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&display=swap');
        body { font-family: 'Lexend', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .category-active { border-bottom: 3px solid #3b82f6; color: #3b82f6; font-weight: 700; }
        .modal { transition: opacity 0.25s ease; }
        .admin-page { display: none; position: fixed; inset: 0; background: #f3f4f6; z-index: 100; overflow-y: auto; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-24">

    <div id="customerPage">
        <header class="bg-white shadow-sm sticky top-0 z-40">
            <div class="p-4 flex justify-between items-center gap-4">
                <h1 class="text-xl font-bold text-blue-600 uppercase">CÔ HƯƠNG - CAFE</h1>
                <div class="flex items-center gap-3">
                    <select id="serviceType" onchange="checkServiceType()" class="bg-blue-50 text-blue-700 text-sm font-semibold py-1.5 px-3 rounded-full outline-none">
                        <option value="Dùng tại quán">Tại quán</option>
                        <option value="Giao hàng tận nơi">Giao hàng</option>
                    </select>
                    <button onclick="accessAdmin()" class="p-2 text-gray-400">⚙️</button>
                </div>
            </div>
            <div class="px-4 pb-3">
                <input type="text" id="menuSearch" oninput="renderCustomerMenu()" placeholder="Tìm món..." class="w-full bg-gray-100 rounded-xl py-2 px-4 text-sm outline-none">
            </div>
            <div class="flex overflow-x-auto hide-scrollbar px-4 gap-6 border-b">
                <button onclick="filterByCat('Tất cả')" class="cat-btn py-3 text-gray-500 whitespace-nowrap category-active">Tất cả</button>
                <button onclick="filterByCat('Đồ uống')" class="cat-btn py-3 text-gray-500 whitespace-nowrap">Đồ uống</button>
                <button onclick="filterByCat('Đồ ăn vặt')" class="cat-btn py-3 text-gray-500 whitespace-nowrap">Đồ ăn vặt</button>
            </div>
        </header>

        <main class="p-4 grid grid-cols-2 md:grid-cols-4 gap-4" id="menuGrid"></main>
    </div>

    <div id="floatingCart" onclick="toggleOrderModal()" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-blue-600 text-white p-4 rounded-2xl shadow-2xl flex justify-between items-center cursor-pointer hidden z-50">
        <div class="flex items-center gap-3">
            <span class="bg-white text-blue-600 w-7 h-7 flex items-center justify-center rounded-full font-bold" id="cartCount">0</span>
            <span class="font-semibold uppercase text-sm">Xem đơn hàng</span>
        </div>
        <span class="font-bold text-lg" id="cartTotal">0đ</span>
    </div>

    <div id="adminPage" class="admin-page p-4 md:p-8">
        <div class="max-w-5xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold uppercase">Quản Lý Menu</h1>
                <button onclick="closeAdmin()" class="bg-red-500 text-white px-4 py-2 rounded-lg font-bold">Thoát</button>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm mb-8 border border-gray-200">
                <h2 class="text-lg font-semibold mb-4 text-blue-600">Thêm Món Mới</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                    <input type="text" id="itemName" placeholder="Tên món..." class="border p-2.5 rounded-lg outline-none">
                    <input type="number" id="itemPrice" placeholder="Giá..." class="border p-2.5 rounded-lg outline-none">
                    <select id="itemCategory" class="border p-2.5 rounded-lg bg-white">
                        <option value="Đồ uống">Đồ uống</option>
                        <option value="Đồ ăn vặt">Đồ ăn vặt</option>
                    </select>
                    <input type="file" id="itemFile" accept="image/*" class="text-xs">
                    <button id="btnAdd" onclick="addItem()" class="bg-blue-600 text-white px-4 py-2.5 rounded-lg font-semibold">Lưu Món</button>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50 border-b">
                        <tr>
                            <th class="p-4">Ảnh</th>
                            <th class="p-4">Tên</th>
                            <th class="p-4">Giá</th>
                            <th class="p-4 text-center">Trạng thái</th>
                            <th class="p-4 text-right">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="adminMenuList" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="orderModal" class="fixed inset-0 bg-white z-[70] hidden flex flex-col">
        <div class="p-4 border-b flex items-center justify-between">
            <button onclick="toggleOrderModal()" class="text-xl font-bold">✕</button>
            <h2 class="font-bold text-lg uppercase">Đơn hàng của bạn</h2>
            <div class="w-5"></div>
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-4" id="orderItemsList"></div>
        <div class="p-6 border-t bg-gray-50">
            <div class="space-y-3 mb-4">
                <input type="text" id="custName" placeholder="Tên của bạn" class="w-full p-3 rounded-lg border">
                <input type="tel" id="custPhone" placeholder="Số điện thoại" class="w-full p-3 rounded-lg border">
                <textarea id="custAddress" placeholder="Địa chỉ (nếu giao hàng)" class="w-full p-3 rounded-lg border hidden"></textarea>
            </div>
            <div class="flex justify-between items-center">
                <span id="finalTotal" class="text-2xl font-bold text-blue-600">0đ</span>
                <button onclick="confirmOrder()" class="bg-green-600 text-white px-8 py-4 rounded-xl font-bold">GỬI QUA ZALO</button>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-[110]">
        <div class="modal-overlay absolute w-full h-full bg-black opacity-50" onclick="toggleEditModal()"></div>
        <div class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded-xl shadow-2xl z-50 p-6 overflow-y-auto">
            <h3 class="text-xl font-bold mb-4">Chỉnh sửa món</h3>
            <input type="hidden" id="editId">
            <div class="space-y-4">
                <input type="text" id="editName" class="w-full border p-2 rounded-lg" placeholder="Tên món">
                <input type="number" id="editPrice" class="w-full border p-2 rounded-lg" placeholder="Giá">
                <select id="editCategory" class="w-full border p-2 rounded-lg">
                    <option value="Đồ uống">Đồ uống</option>
                    <option value="Đồ ăn vặt">Đồ ăn vặt</option>
                </select>
                <input type="file" id="editFile" class="text-xs">
                <div class="flex justify-end gap-2 mt-4">
                    <button onclick="toggleEditModal()" class="px-4 py-2 bg-gray-200 rounded-lg">Hủy</button>
                    <button id="btnUpdate" onclick="updateItem()" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-bold">Cập Nhật</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            token_rev: 'KCGVs3iu1ql tZ yj acIWH5dDAKQR oXJQ t5t0 _phg'.replace(/\s/g, '').split('').reverse().join(''),
            username: 'shiban31',
            repo: 'Menu-Co-Huong',
            file: 'menu.json',
            zalo_phone: '0338016477' // <--- THAY SỐ ZALO CỦA BẠN
        };

        let menu = [];
        let cart = [];
        let currentCat = 'Tất cả';

        // TẢI DỮ LIỆU
        async function loadData() {
            try {
                const res = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.file}?t=${Date.now()}`);
                const data = await res.json();
                const content = decodeURIComponent(atob(data.content).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                menu = JSON.parse(content);
                renderCustomerMenu();
                renderAdminMenu();
            } catch (e) { console.log("Chưa có file menu.json trên GitHub."); }
        }

        // LƯU DỮ LIỆU LÊN GITHUB
        async function saveData() {
            try {
                const res = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.file}`);
                const fileData = await res.json();
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(menu))));
                await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.file}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${CONFIG.token_rev}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: "Update Menu", content: content, sha: fileData.sha })
                });
                renderCustomerMenu();
                renderAdminMenu();
            } catch (e) { alert("Lỗi lưu lên GitHub! Kiểm tra lại Token."); }
        }

        // --- GIAO DIỆN KHÁCH ---
        function renderCustomerMenu() {
            const grid = document.getElementById('menuGrid');
            const search = document.getElementById('menuSearch').value.toLowerCase();
            grid.innerHTML = '';
            const filtered = menu.filter(m => (currentCat === 'Tất cả' || m.category === currentCat) && m.name.toLowerCase().includes(search));
            
            filtered.forEach(item => {
                const isOut = item.inStock === false;
                grid.innerHTML += `
                    <div onclick="${isOut ? '' : `addToCartDirect(${item.id})`}" class="bg-white rounded-2xl overflow-hidden shadow-sm border relative ${isOut ? 'opacity-60 grayscale' : 'active:scale-95'} transition-all">
                        <img src="${item.image || 'https://placehold.co/400x400'}" class="w-full h-32 object-cover">
                        ${isOut ? '<div class="absolute inset-0 flex items-center justify-center bg-black/40 text-white font-bold text-xs uppercase">Hết hàng</div>' : ''}
                        <div class="p-3">
                            <h3 class="font-bold text-gray-800 text-xs h-8 line-clamp-2 uppercase">${item.name}</h3>
                            <p class="text-blue-600 font-bold text-sm mt-1">${item.price.toLocaleString()}đ</p>
                        </div>
                    </div>`;
            });
        }

        function filterByCat(cat) {
            currentCat = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('category-active', b.innerText === cat));
            renderCustomerMenu();
        }

        function addToCartDirect(id) {
            const item = menu.find(m => m.id === id);
            const exist = cart.find(c => c.id === id);
            if(exist) exist.qty++;
            else cart.push({...item, qty: 1});
            updateCartUI();
        }

        function updateCartUI() {
            const count = cart.reduce((s, i) => s + i.qty, 0);
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            document.getElementById('floatingCart').classList.toggle('hidden', count === 0);
            document.getElementById('cartCount').innerText = count;
            document.getElementById('cartTotal').innerText = total.toLocaleString() + 'đ';
        }

        // --- QUẢN TRỊ ---
        async function addItem() {
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;
            const cat = document.getElementById('itemCategory').value;
            const file = document.getElementById('itemFile').files[0];
            if(!name || !price) return alert("Nhập đủ thông tin!");

            document.getElementById('btnAdd').innerText = "⏳ Đang lưu...";
            let imgBase64 = "https://placehold.co/100x100?text=Food";
            if(file) {
                imgBase64 = await new Promise(r => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => r(reader.result);
                });
            }

            menu.push({ id: Date.now(), name, price: parseInt(price), category: cat, image: imgBase64, inStock: true });
            await saveData();
            document.getElementById('btnAdd').innerText = "Lưu Món";
            document.getElementById('itemName').value = ''; document.getElementById('itemPrice').value = '';
        }

        function renderAdminMenu() {
            const tbody = document.getElementById('adminMenuList');
            tbody.innerHTML = '';
            menu.forEach(item => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-4"><img src="${item.image}" class="w-12 h-12 rounded object-cover"></td>
                        <td class="p-4 font-bold text-xs uppercase">${item.name}</td>
                        <td class="p-4 text-blue-600 font-bold">${item.price.toLocaleString()}đ</td>
                        <td class="p-4 text-center">
                            <button onclick="toggleStock(${item.id})" class="text-[10px] px-3 py-1 rounded-full font-bold ${item.inStock !== false ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">
                                ${item.inStock !== false ? 'CÒN HÀNG' : 'HẾT HÀNG'}
                            </button>
                        </td>
                        <td class="p-4 text-right space-x-2">
                            <button onclick="openEdit(${item.id})" class="text-blue-500 text-xs">Sửa</button>
                            <button onclick="deleteItem(${item.id})" class="text-red-400 text-xs">Xóa</button>
                        </td>
                    </tr>`;
            });
        }

        async function toggleStock(id) {
            const item = menu.find(i => i.id === id);
            item.inStock = (item.inStock === false) ? true : false;
            await saveData();
        }

        async function deleteItem(id) {
            if(confirm("Chắc chắn xóa?")) {
                menu = menu.filter(i => i.id !== id);
                await saveData();
            }
        }

        function openEdit(id) {
            const item = menu.find(i => i.id === id);
            document.getElementById('editId').value = item.id;
            document.getElementById('editName').value = item.name;
            document.getElementById('editPrice').value = item.price;
            document.getElementById('editCategory').value = item.category;
            toggleEditModal();
        }

        async function updateItem() {
            const id = parseInt(document.getElementById('editId').value);
            const item = menu.find(i => i.id === id);
            const file = document.getElementById('editFile').files[0];
            
            document.getElementById('btnUpdate').innerText = "⏳...";
            item.name = document.getElementById('editName').value;
            item.price = parseInt(document.getElementById('editPrice').value);
            item.category = document.getElementById('editCategory').value;
            
            if(file) {
                item.image = await new Promise(r => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => r(reader.result);
                });
            }
            await saveData();
            document.getElementById('btnUpdate').innerText = "Cập Nhật";
            toggleEditModal();
        }

        // --- HÀM HỖ TRỢ ---
        function accessAdmin() { if(prompt("Mật khẩu:") === '123456') document.getElementById('adminPage').style.display = 'block'; }
        function closeAdmin() { document.getElementById('adminPage').style.display = 'none'; }
        function toggleEditModal() { 
            const m = document.getElementById('editModal');
            m.classList.toggle('opacity-0'); m.classList.toggle('pointer-events-none');
        }
        function toggleOrderModal() {
            document.getElementById('orderModal').classList.toggle('hidden');
            renderOrderItems();
        }
        function checkServiceType() {
            document.getElementById('custAddress').classList.toggle('hidden', document.getElementById('serviceType').value === 'Dùng tại quán');
        }
        function renderOrderItems() {
            const list = document.getElementById('orderItemsList');
            list.innerHTML = '';
            cart.forEach(item => {
                list.innerHTML += `<div class="flex justify-between border-b pb-2 text-sm">
                    <span>${item.name} x${item.qty}</span>
                    <span class="font-bold">${(item.price * item.qty).toLocaleString()}đ</span>
                </div>`;
            });
            document.getElementById('finalTotal').innerText = cart.reduce((s,i)=>s+(i.price*i.qty),0).toLocaleString() + 'đ';
        }

        function confirmOrder() {
            const n = document.getElementById('custName').value;
            const p = document.getElementById('custPhone').value;
            const a = document.getElementById('custAddress').value;
            const type = document.getElementById('serviceType').value;
            if(!n || !p) return alert("Nhập tên và số điện thoại!");

            let bill = `ĐƠN HÀNG: CÔ HƯƠNG\n---\n`;
            cart.forEach(i => bill += `${i.name} x${i.qty}\n`);
            bill += `---\nTổng: ${document.getElementById('finalTotal').innerText}\nKhách: ${n}\nSĐT: ${p}\nLoại: ${type}\nĐC: ${a}`;

            navigator.clipboard.writeText(bill).then(() => {
                alert("Đã copy đơn! Đang mở Zalo của quán...");
                window.location.href = `https://zalo.me/${CONFIG.zalo_phone}`;
            });
        }

        loadData();
    </script>
</body>
</html>
