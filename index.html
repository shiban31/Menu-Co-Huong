<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Thông Minh - CÔ HƯƠNG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&display=swap');
        body { font-family: 'Lexend', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .category-active { border-bottom: 3px solid #3b82f6; color: #3b82f6; font-weight: 700; }
        .admin-page { display: none; position: fixed; inset: 0; background: #f3f4f6; z-index: 100; overflow-y: auto; }
        /* Hiệu ứng loading */
        #loadingOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; color: white; flex-direction: column; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-24">

    <div id="loadingOverlay">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-white border-t-transparent mb-4"></div>
        <p class="font-bold">Đang cập nhật dữ liệu...</p>
    </div>

    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="p-4 flex justify-between items-center gap-4">
            <h1 class="text-xl font-bold text-blue-600 shrink-0 uppercase">CÔ HƯƠNG - CAFE & SNACK</h1>
            <div class="flex items-center gap-3">
                <select id="serviceType" onchange="checkServiceType()" class="bg-blue-50 text-blue-700 text-sm font-semibold py-1.5 px-3 rounded-full outline-none border border-blue-200">
                    <option value="Dùng tại quán">Tại quán</option>
                    <option value="Giao hàng tận nơi">Giao hàng</option>
                </select>
                <button onclick="accessAdmin()" class="p-2 text-gray-400 hover:text-blue-600">⚙️</button>
            </div>
        </div>

        <div class="px-4 pb-3">
            <div class="relative group">
                <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">🔍</span>
                <input type="text" id="menuSearch" oninput="renderCustomerMenu()" placeholder="Tìm món bạn thích..." 
                    class="w-full bg-gray-100 border-none rounded-xl py-2.5 pl-10 pr-4 text-sm outline-none focus:ring-2 focus:ring-blue-400 transition-all">
            </div>
        </div>

        <div class="flex overflow-x-auto hide-scrollbar px-4 gap-6 border-b border-gray-100">
            <button onclick="filterByCat('Tất cả')" class="cat-btn py-3 text-gray-500 whitespace-nowrap category-active" id="btn-all">Tất cả</button>
            <button onclick="filterByCat('Đồ uống')" class="cat-btn py-3 text-gray-500 whitespace-nowrap" id="btn-drinks">Đồ uống</button>
            <button onclick="filterByCat('Đồ ăn vặt')" class="cat-btn py-3 text-gray-500 whitespace-nowrap" id="btn-snacks">Đồ ăn vặt</button>
        </div>
    </header>

    <main class="p-4 grid grid-cols-2 md:grid-cols-4 gap-4" id="menuGrid"></main>

    <div id="noMatch" class="hidden text-center py-20 text-gray-400 italic">Món này hiện chưa có...</div>

    <div id="floatingCart" onclick="toggleOrderModal()" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-blue-600 text-white p-4 rounded-2xl shadow-2xl flex justify-between items-center cursor-pointer hidden z-50">
        <div class="flex items-center gap-3">
            <span class="bg-white text-blue-600 w-7 h-7 flex items-center justify-center rounded-full font-bold" id="cartCount">0</span>
            <span class="font-semibold uppercase text-sm">Xem đơn hàng</span>
        </div>
        <span class="font-bold text-lg" id="cartTotal">0đ</span>
    </div>

    <div id="qtyModal" class="fixed inset-0 bg-black/60 z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-xs overflow-hidden shadow-2xl">
            <img id="modalImg" src="" class="w-full h-44 object-cover">
            <div class="p-6 text-center">
                <h3 id="modalName" class="text-xl font-bold uppercase"></h3>
                <p id="modalPrice" class="text-blue-600 font-bold text-lg mb-4"></p>
                <div class="flex justify-center items-center gap-8 mb-6">
                    <button onclick="changeQty(-1)" class="w-12 h-12 border-2 rounded-full text-2xl">-</button>
                    <span id="modalQty" class="text-3xl font-bold w-8">1</span>
                    <button onclick="changeQty(1)" class="w-12 h-12 border-2 border-blue-600 rounded-full text-blue-600 text-2xl">+</button>
                </div>
                <button onclick="addToCart()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg">Thêm vào đơn</button>
                <button onclick="closeQtyModal()" class="mt-4 text-gray-400">Để sau</button>
            </div>
        </div>
    </div>

    <div id="adminPage" class="admin-page p-4 md:p-8">
        <div class="max-w-5xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold uppercase">Quản lý Menu</h1>
                <button onclick="closeAdmin()" class="bg-red-500 text-white px-4 py-2 rounded-lg font-bold">THOÁT</button>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm mb-8 border">
                <h2 class="font-bold mb-4 text-blue-600">Thêm Món Mới</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                    <input type="text" id="itemName" placeholder="Tên món..." class="border p-2.5 rounded-lg outline-none">
                    <input type="number" id="itemPrice" placeholder="Giá..." class="border p-2.5 rounded-lg outline-none">
                    <select id="itemCategory" class="border p-2.5 rounded-lg">
                        <option value="Đồ uống">Đồ uống</option>
                        <option value="Đồ ăn vặt">Đồ ăn vặt</option>
                    </select>
                    <input type="file" id="itemFile" accept="image/*" class="text-xs">
                    <button onclick="addItem()" class="bg-blue-600 text-white px-4 py-2.5 rounded-lg font-bold">Lưu & Đẩy Lên</button>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 border-b text-sm">
                        <tr>
                            <th class="p-4">Ảnh</th>
                            <th class="p-4">Tên</th>
                            <th class="p-4">Giá</th>
                            <th class="p-4 text-center">Kho</th>
                            <th class="p-4 text-right">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="adminMenuList" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- CẤU HÌNH ĐỒNG BỘ GITHUB ---
        const CONFIG = {
            // Token này bạn đã cung cấp, tôi giữ nguyên
            token: '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',
            username: 'shiban31',
            repo: 'Menu-Co-Huong',
            file: 'menu.json'
        };

        let menu = [];
        let cart = [];
        let currentItem = null;
        let tempQty = 1;
        let currentCat = 'Tất cả';

        // 1. TẢI DỮ LIỆU TỪ GITHUB (Mỗi khi mở trang)
        async function loadData() {
            try {
                const url = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.file}?t=${Date.now()}`;
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    // Giải mã Base64 từ GitHub sang JSON tiếng Việt
                    const content = decodeURIComponent(escape(atob(data.content)));
                    menu = JSON.parse(content);
                }
            } catch (e) {
                console.log("Chưa có file menu.json hoặc lỗi kết nối.");
                menu = [];
            }
            renderCustomerMenu();
            renderAdminMenu();
        }

        // 2. LƯU DỮ LIỆU LÊN GITHUB (Mỗi khi thay đổi)
        async function saveData() {
            showLoading(true);
            try {
                // Bước A: Lấy SHA của file cũ (bắt buộc để cập nhật)
                const getRes = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.file}`);
                let sha = "";
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                }

                // Bước B: Mã hóa nội dung mới sang Base64
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(menu))));

                // Bước C: Gửi yêu cầu PUT lên GitHub API
                const putRes = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.file}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${CONFIG.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Cập nhật menu.json qua giao diện quản trị",
                        content: content,
                        sha: sha || undefined
                    })
                });

                if (putRes.ok) {
                    console.log("Đồng bộ GitHub thành công!");
                } else {
                    alert("Lỗi khi đồng bộ lên GitHub!");
                }
            } catch (e) {
                alert("Lỗi kết nối API GitHub!");
            }
            showLoading(false);
            renderCustomerMenu();
            renderAdminMenu();
        }

        // --- HÀM GIAO DIỆN ---
        function showLoading(show) {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }

        function renderCustomerMenu() {
            const grid = document.getElementById('menuGrid');
            const search = document.getElementById('menuSearch').value.toLowerCase();
            grid.innerHTML = '';
            
            const filtered = menu.filter(m => 
                m.inStock && 
                (currentCat === 'Tất cả' || m.category === currentCat) &&
                m.name.toLowerCase().includes(search)
            );

            document.getElementById('noMatch').classList.toggle('hidden', filtered.length > 0);

            filtered.forEach(item => {
                grid.innerHTML += `
                    <div onclick="openQtyModal(${item.id})" class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 active:scale-95 transition-all">
                        <img src="${item.image}" class="w-full h-36 object-cover">
                        <div class="p-3">
                            <h3 class="font-bold text-gray-800 text-xs h-8 line-clamp-2 uppercase">${item.name}</h3>
                            <p class="text-blue-600 font-black text-sm mt-1">${item.price.toLocaleString()}đ</p>
                        </div>
                    </div>`;
            });
        }

        function renderAdminMenu() {
            const tbody = document.getElementById('adminMenuList');
            tbody.innerHTML = '';
            menu.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td class="p-3"><img src="${item.image}" class="w-12 h-12 rounded object-cover"></td>
                        <td class="p-3 font-bold text-xs uppercase">${item.name}</td>
                        <td class="p-3 text-blue-600 font-bold">${item.price.toLocaleString()}</td>
                        <td class="p-3 text-center">
                            <button onclick="toggleStock(${item.id})" class="text-[10px] px-2 py-1 rounded-full ${item.inStock ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">
                                ${item.inStock ? 'CÒN' : 'HẾT'}
                            </button>
                        </td>
                        <td class="p-3 text-right space-x-2">
                            <button onclick="deleteItem(${item.id})" class="text-red-400 text-xs">Xóa</button>
                        </td>
                    </tr>`;
            });
        }

        // --- HÀM NGHIỆP VỤ QUẢN TRỊ ---
        async function addItem() {
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;
            const category = document.getElementById('itemCategory').value;
            const file = document.getElementById('itemFile').files[0];

            if (!name || !price) return alert("Vui lòng nhập tên và giá!");

            let imgBase64 = "https://placehold.co/400x400?text=Food";
            if (file) {
                imgBase64 = await getBase64(file);
            }

            const newItem = {
                id: Date.now(),
                name,
                price: parseInt(price),
                category,
                inStock: true,
                image: imgBase64
            };

            menu.push(newItem);
            await saveData(); // Lưu vào menu.json trên GitHub
            
            // Reset form
            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
            document.getElementById('itemFile').value = '';
        }

        async function toggleStock(id) {
            menu = menu.map(i => i.id === id ? {...i, inStock: !i.inStock} : i);
            await saveData();
        }

        async function deleteItem(id) {
            if(confirm("Bạn muốn xóa món này?")) {
                menu = menu.filter(i => i.id !== id);
                await saveData();
            }
        }

        // --- CÁC HÀM TIỆN ÍCH ---
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function accessAdmin() {
            const pass = prompt("Nhập mật khẩu:");
            if(pass === (localStorage.getItem('adminPass') || '123456')) {
                document.getElementById('adminPage').style.display = 'block';
            }
        }

        function closeAdmin() { document.getElementById('adminPage').style.display = 'none'; }

        function filterByCat(cat) {
            currentCat = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('category-active'));
            event.target.classList.add('category-active');
            renderCustomerMenu();
        }

        // Khởi động
        loadData();

        // (Các hàm openQtyModal, addToCart... giữ nguyên như logic cũ của bạn)
        function openQtyModal(id) {
            currentItem = menu.find(m => m.id === id);
            tempQty = 1;
            document.getElementById('modalName').innerText = currentItem.name;
            document.getElementById('modalPrice').innerText = currentItem.price.toLocaleString() + 'đ';
            document.getElementById('modalImg').src = currentItem.image;
            document.getElementById('modalQty').innerText = tempQty;
            document.getElementById('qtyModal').classList.remove('hidden');
        }
        function closeQtyModal() { document.getElementById('qtyModal').classList.add('hidden'); }
        function changeQty(n) { tempQty = Math.max(1, tempQty + n); document.getElementById('modalQty').innerText = tempQty; }
        function addToCart() {
            const existing = cart.find(c => c.id === currentItem.id);
            if(existing) existing.qty += tempQty;
            else cart.push({ ...currentItem, qty: tempQty });
            updateCartUI();
            closeQtyModal();
        }
        function updateCartUI() {
            const count = cart.reduce((s, i) => s + i.qty, 0);
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            document.getElementById('floatingCart').classList.toggle('hidden', count === 0);
            document.getElementById('cartCount').innerText = count;
            document.getElementById('cartTotal').innerText = total.toLocaleString() + 'đ';
        }
        function checkServiceType() {
            // Logic ẩn hiện form giao hàng
        }
    </script>
</body>
</html>
