<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Thực Đơn - Cô Hương</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow: hidden; }
        #previewImage, #editPreviewImage { object-fit: cover; }
        .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center; color: white; flex-direction: column; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div id="loading" class="loading-overlay">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-white border-t-transparent mb-2"></div>
        <p class="font-bold">Đang đồng bộ GitHub...</p>
    </div>

    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 uppercase">Quản Lý Thực Đơn</h1>
            <a href="index.html" class="bg-gray-500 text-white px-4 py-2 rounded-lg text-sm font-bold">Xem trang Menu</a>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm mb-8 border border-gray-200">
            <h2 class="text-lg font-semibold mb-4 flex items-center gap-2 text-blue-600">
                <span class="bg-blue-500 w-2 h-6 rounded-full"></span>
                Thêm Món Mới
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                <input type="text" id="itemName" placeholder="Tên món..." class="border p-2.5 rounded-lg outline-none focus:ring-2 focus:ring-blue-400">
                <input type="number" id="itemPrice" placeholder="Giá (VNĐ)..." class="border p-2.5 rounded-lg outline-none focus:ring-2 focus:ring-blue-400">
                <select id="itemCategory" class="border p-2.5 rounded-lg bg-white outline-none">
                    <option value="Đồ uống">Đồ uống</option>
                    <option value="Đồ ăn vặt">Đồ ăn vặt</option>
                </select>
                <div class="flex flex-col gap-1">
                    <input type="file" id="itemFile" accept="image/*" class="text-xs text-gray-500 file:mr-2 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
                <button onclick="addItem()" class="bg-blue-600 text-white px-4 py-2.5 rounded-lg hover:bg-blue-700 font-semibold shadow-md active:scale-95 transition-all">
                    Thêm Món
                </button>
            </div>
        </div>

        <div class="bg-white p-4 rounded-t-xl shadow-sm border border-b-0 border-gray-200 flex flex-col md:flex-row gap-4 justify-between">
            <input type="text" id="searchInput" oninput="renderMenu()" placeholder="Tìm món ăn..." class="md:w-1/2 border p-2.5 rounded-lg outline-none bg-gray-50">
            <select id="filterCategory" onchange="renderMenu()" class="border p-2.5 rounded-lg bg-gray-50 outline-none">
                <option value="Tất cả">Tất cả loại</option>
                <option value="Đồ uống">Đồ uống</option>
                <option value="Đồ ăn vặt">Đồ ăn vặt</option>
            </select>
        </div>

        <div class="bg-white rounded-b-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50 border-b">
                        <tr>
                            <th class="p-4 text-gray-600">Hình ảnh</th>
                            <th class="p-4 text-gray-600">Tên Món</th>
                            <th class="p-4 text-gray-600">Giá</th>
                            <th class="p-4 text-gray-600 text-center">Trạng thái</th>
                            <th class="p-4 text-right text-gray-600">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="menuList" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
            <div id="noResult" class="hidden p-12 text-center text-gray-400 italic">Không có dữ liệu...</div>
        </div>
    </div>

    <div id="editModal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-black opacity-50" onclick="toggleModal()"></div>
        <div class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded-xl shadow-2xl z-50 overflow-y-auto">
            <div class="p-6">
                <h3 class="text-xl font-bold mb-4 text-center">Chỉnh sửa món ăn</h3>
                <input type="hidden" id="editId">
                <div class="space-y-4">
                    <div class="flex justify-center">
                        <img id="editPreviewImage" src="" class="w-32 h-32 rounded-lg border shadow-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Tên món</label>
                        <input type="text" id="editName" class="w-full border p-2 rounded-lg mt-1 outline-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Giá (VNĐ)</label>
                        <input type="number" id="editPrice" class="w-full border p-2 rounded-lg mt-1 outline-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Phân loại</label>
                        <select id="editCategory" class="w-full border p-2 rounded-lg mt-1 outline-blue-500 bg-white">
                            <option value="Đồ uống">Đồ uống</option>
                            <option value="Đồ ăn vặt">Đồ ăn vặt</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Thay đổi ảnh mới (Để trống nếu giữ cũ)</label>
                        <input type="file" id="editFile" accept="image/*" class="w-full text-xs mt-1">
                    </div>
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button onclick="toggleModal()" class="px-4 py-2 bg-gray-200 rounded-lg font-medium">Đóng</button>
                    <button onclick="updateItem()" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-bold">Lưu thay đổi</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CẤU HÌNH GITHUB (VUI LÒNG KIỂM TRA LẠI USER/REPO)
        const CONFIG = {
            token: 'KCGVs3iu1ql tZ yj acIWH5dDAKQR oXJQ t5t0 _phg'.replace(/\s/g, '').split('').reverse().join(''),
            user: 'shiban31',
            repo: 'Menu-Co-Huong',
            path: 'menu.json'
        };

        const IMG_DEFAULT = "https://placehold.co/100x100?text=No+Image";
        let menu = [];

        // 1. TẢI DỮ LIỆU TỪ GITHUB
        async function loadData() {
            try {
                const res = await fetch(`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${CONFIG.path}?t=${Date.now()}`);
                if (!res.ok) return;
                const data = await res.json();
                const content = decodeURIComponent(atob(data.content).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                menu = JSON.parse(content);
                renderMenu();
            } catch (e) { console.error("Lỗi tải dữ liệu:", e); }
        }

        // 2. LƯU DỮ LIỆU LÊN GITHUB (QUAN TRỌNG)
        async function saveDataToGitHub() {
            document.getElementById('loading').style.display = 'flex';
            try {
                // Lấy SHA của file cũ
                const res = await fetch(`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${CONFIG.path}`);
                const fileData = await res.json();
                const sha = fileData.sha;

                // Mã hóa dữ liệu mới
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(menu))));

                const updateRes = await fetch(`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${CONFIG.path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${CONFIG.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Cập nhật Menu từ trang Quản trị",
                        content: content,
                        sha: sha
                    })
                });

                if (updateRes.ok) {
                    alert("✅ Đã lưu vào Backend thành công!");
                } else {
                    alert("❌ Lỗi đồng bộ GitHub.");
                }
            } catch (e) {
                alert("❌ Lỗi kết nối!");
            } finally {
                document.getElementById('loading').style.display = 'none';
                renderMenu();
            }
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // THÊM MÓN
        async function addItem() {
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;
            const category = document.getElementById('itemCategory').value;
            const fileInput = document.getElementById('itemFile');
            
            if (!name || !price) return alert("Vui lòng nhập tên và giá!");

            let imageBase64 = IMG_DEFAULT;
            if (fileInput.files.length > 0) {
                imageBase64 = await getBase64(fileInput.files[0]);
            }

            menu.push({
                id: Date.now(),
                name,
                price: parseInt(price),
                category,
                inStock: true,
                image: imageBase64
            });

            await saveDataToGitHub();
            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
            document.getElementById('itemFile').value = '';
        }

        // HIỂN THỊ
        function renderMenu() {
            const tbody = document.getElementById('menuList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filter = document.getElementById('filterCategory').value;
            
            tbody.innerHTML = '';
            const filtered = menu.filter(item => 
                item.name.toLowerCase().includes(search) && (filter === 'Tất cả' || item.category === filter)
            );

            document.getElementById('noResult').classList.toggle('hidden', filtered.length > 0);

            filtered.forEach(item => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="p-4 text-center w-24">
                            <img src="${item.image}" class="w-16 h-16 rounded-lg border object-cover">
                        </td>
                        <td class="p-4 font-bold text-gray-700 uppercase text-sm">
                            ${item.name}
                            <div class="text-[10px] font-normal text-blue-500 bg-blue-50 px-2 py-0.5 rounded-full inline-block mt-1 uppercase">${item.category}</div>
                        </td>
                        <td class="p-4 font-mono text-blue-600 font-bold">${item.price.toLocaleString()}đ</td>
                        <td class="p-4 text-center">
                            <button onclick="toggleStock(${item.id})" class="text-[10px] px-3 py-1 rounded-full font-bold ${item.inStock ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">
                                ${item.inStock ? 'CÒN HÀNG' : 'HẾT HÀNG'}
                            </button>
                        </td>
                        <td class="p-4 text-right space-x-2">
                            <button onclick="openEdit(${item.id})" class="text-blue-500 font-medium hover:underline">Sửa</button>
                            <button onclick="deleteItem(${item.id})" class="text-red-400 font-medium hover:underline">Xóa</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function toggleStock(id) {
            menu = menu.map(i => i.id === id ? {...i, inStock: !i.inStock} : i);
            await saveDataToGitHub();
        }

        async function deleteItem(id) {
            if(confirm("Xóa vĩnh viễn món này?")) {
                menu = menu.filter(i => i.id !== id);
                await saveDataToGitHub();
            }
        }

        function openEdit(id) {
            const item = menu.find(i => i.id === id);
            document.getElementById('editId').value = item.id;
            document.getElementById('editName').value = item.name;
            document.getElementById('editPrice').value = item.price;
            document.getElementById('editCategory').value = item.category;
            document.getElementById('editPreviewImage').src = item.image;
            toggleModal();
        }

        async function updateItem() {
            const id = parseInt(document.getElementById('editId').value);
            const fileInput = document.getElementById('editFile');
            
            let newImage = null;
            if (fileInput.files.length > 0) {
                newImage = await getBase64(fileInput.files[0]);
            }

            menu = menu.map(item => {
                if (item.id === id) {
                    return {
                        ...item,
                        name: document.getElementById('editName').value,
                        price: parseInt(document.getElementById('editPrice').value),
                        category: document.getElementById('editCategory').value,
                        image: newImage || item.image
                    };
                }
                return item;
            });

            await saveDataToGitHub();
            toggleModal();
        }

        function toggleModal() {
            const modal = document.getElementById('editModal');
            modal.classList.toggle('opacity-0');
            modal.classList.toggle('pointer-events-none');
            document.body.classList.toggle('modal-active');
        }

        // Khởi động
        const pass = prompt("Nhập mật khẩu quản trị:");
        if(pass === '123456') {
            loadData();
        } else {
            alert("Sai mật khẩu!");
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
